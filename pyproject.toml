[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedsync"
version = "0.6.0"
description = "Incremental synchronization between source documents and vector indexes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yash Shah", email = "yash376351@gmail.com" }]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/yashshah9/embedsync"
Repository = "https://github.com/yashshah9/embedsync"
Issues = "https://github.com/yashshah9/embedsync/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
pg = ["psycopg[binary]>=3.1"]

[project.scripts]
embedsync = "embedsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embedsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["embedsync"]
