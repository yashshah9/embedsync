services:
  test:
    build: {context: ., dockerfile: docker/Dockerfile}
    volumes: [".:/app"]
    working_dir: /app
    command: ["pytest", "tests/", "-v"]
  plan:
    build: {context: ., dockerfile: docker/Dockerfile}
    volumes: [".:/app"]
    working_dir: /app
    command: ["embedsync", "plan", "examples/docs"]
